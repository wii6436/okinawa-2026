    let currentChapter = 0;

    // 載入章節
    function loadChapter(ch) {
      currentChapter = ch;
      for(let i=0; i<=5; i++){
        const btn = document.getElementById('tab-' + i);
        if(i === ch){
          btn.classList.remove('bg-white', 'text-slate-700');
          btn.classList.add('bg-amber-400', 'text-slate-900');
        } else {
          btn.classList.remove('bg-amber-400', 'text-slate-900');
          btn.classList.add('bg-white', 'text-slate-700');
        }
      }

      const prolSec = document.getElementById('prologue-section');
      const container = document.getElementById('quest-container');

      if(ch === 0) {
        document.getElementById('chapter-badge').innerText = "PROLOGUE";
        document.getElementById('chapter-title').innerText = "序章：勇者出征行囊裝備檢視";
        document.getElementById('chapter-location').innerHTML = '<i class="fa-solid fa-compass"></i> 出發前在台檢核';
        document.getElementById('chapter-desc').innerText = "出發前往琉球國度之前，請各位隊長與副駕務必清點背包道具。全部打勾後即可順利出征！";
        prolSec.classList.remove('hidden');
        container.innerHTML = '';
        renderInventory();
      } else {
        prolSec.classList.add('hidden');
        const data = adventures[ch];
        document.getElementById('chapter-badge').innerText = data.badge;
        document.getElementById('chapter-title').innerText = data.title;
        document.getElementById('chapter-location').innerHTML = '<i class="fa-solid fa-location-dot"></i> ' + data.location;
        document.getElementById('chapter-desc').innerText = data.desc;
        renderQuests(data.quests);
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 渲染序章裝備清單 (具有 LocalStorage 記憶勾選)
    function renderInventory() {
      const renderGroup = (items, elementId) => {
        const el = document.getElementById(elementId);
        el.innerHTML = '';
        items.forEach(item => {
          const checked = localStorage.getItem(item.id) === 'true';
          const row = document.createElement('label');
          row.className = "flex items-start gap-2.5 cursor-pointer select-none py-1 border-b border-slate-100 last:border-none";
          row.innerHTML = `
            <input type="checkbox" onchange="toggleInv('${item.id}', this)" ${checked ? 'checked' : ''} class="w-4 h-4 mt-0.5 rounded text-amber-500 focus:ring-amber-400 cursor-pointer">
            <span class="${checked ? 'line-through text-slate-400 font-normal' : 'font-bold text-slate-700'}">${item.text}</span>
          `;
          el.appendChild(row);
        });
      };
      renderGroup(inventory.essential, 'checklist-essential');
      renderGroup(inventory.baby, 'checklist-baby');
      renderGroup(inventory.driver, 'checklist-driver');
    }

    function toggleInv(id, el) {
      localStorage.setItem(id, el.checked);
      renderInventory();
      if(el.checked) showToast("道具已放入冒險行囊！🎒");
    }

    // 渲染各章任務卡片與集章功能
    function renderQuests(quests) {
      const container = document.getElementById('quest-container');
      container.innerHTML = '';

      quests.forEach((q, idx) => {
        const isStamped = localStorage.getItem("stamp_" + q.id) === 'true';
        const card = document.createElement('div');
        card.className = "nes-box bg-white rounded-2xl overflow-hidden border-3 border-slate-900 relative";
        card.innerHTML = `
          <!-- 照片與實景展示 -->
          <div class="relative h-48 bg-slate-900 overflow-hidden">
            <img src="${q.img}" alt="${q.title}" class="w-full h-full object-cover">
            <div class="absolute inset-0 bg-gradient-to-t from-slate-950/85 via-slate-900/30 to-transparent"></div>
            
            <div class="absolute top-3 left-3 bg-amber-400 text-slate-900 font-pixel text-xs px-2 py-0.5 rounded shadow">
              STAGE 0${idx+1}
            </div>

            <!-- 印章蓋章徽章 (若已蓋章則顯示) -->
            <div id="stamp-badge-${q.id}" class="${isStamped ? '' : 'hidden'} stamp-badge absolute top-3 right-3 bg-amber-400/90 text-red-700 border-2 border-red-600 rounded-full w-14 h-14 flex flex-col items-center justify-center font-pixel shadow-xl -rotate-12 pointer-events-none">
              <span class="text-[9px] font-black tracking-widest leading-none">CLEARED</span>
              <span class="text-xs font-black">已踏破</span>
            </div>

            <div class="absolute bottom-2 left-3 right-3 text-white">
              <span class="text-[10px] bg-sky-600 px-2 py-0.5 rounded font-bold">${q.tag}</span>
              <div class="text-xs text-amber-300 font-pixel mt-0.5">${q.time}</div>
              <h3 class="text-base font-bold text-white drop-shadow">${q.title}</h3>
            </div>
          </div>

          <!-- 說明與功能按鈕 -->
          <div class="p-3.5 space-y-2.5">
            <p class="text-xs text-slate-600 leading-relaxed">${q.desc}</p>
            <div class="bg-amber-50 border border-amber-200 text-amber-900 px-2.5 py-1.5 rounded-lg text-[11px] flex items-center gap-1.5 font-medium">
              <i class="fa-solid fa-camera text-amber-600"></i>
              <span><b>視覺亮點：</b>${q.imgCaption}</span>
            </div>

            <!-- 導航、複製與蓋章按鈕 -->
            <div class="pt-1 flex gap-2">
              <button onclick="toggleStamp('${q.id}')" class="nes-btn flex-1 bg-amber-400 hover:bg-amber-500 text-slate-950 text-xs font-bold py-2 px-2 rounded-xl transition flex items-center justify-center gap-1 font-pixel">
                <i class="fa-solid fa-stamp"></i> 打卡集章
              </button>
              <button onclick="copyMapcode('${q.mapcode}', '${q.title}')" class="nes-btn flex-1 bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold py-2 px-2 rounded-xl transition flex items-center justify-center gap-1">
                <i class="fa-regular fa-copy"></i> Mapcode
              </button>
              <a href="https://maps.google.com/?q=${q.mapQuery}" target="_blank" class="nes-btn flex-1 bg-sky-500 hover:bg-sky-600 text-white text-xs font-bold py-2 px-2 rounded-xl transition flex items-center justify-center gap-1 text-center">
                <i class="fa-solid fa-location-arrow"></i> 導航
              </a>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
      updateStampTotal();
    }

    // 集章切換
    function toggleStamp(qid) {
      const current = localStorage.getItem("stamp_" + qid) === 'true';
      const badge = document.getElementById("stamp-badge-" + qid);
      if(!current) {
        localStorage.setItem("stamp_" + qid, "true");
        badge.classList.remove('hidden');
        showToast("🎖️ 任務達成！成功蓋上冒險神印！");
      } else {
        localStorage.removeItem("stamp_" + qid);
        badge.classList.add('hidden');
        showToast("已重置該景點章戳。");
      }
      updateStampTotal();
    }

    // 計算總印章數
    function updateStampTotal() {
      let count = 0;
      for (let i = 0; i < localStorage.length; i++) {
        if (localStorage.key(i).startsWith("stamp_")) count++;
      }
      document.getElementById('stamp-count').innerText = count;
    }

    // 複製 Mapcode
    function copyMapcode(code, name) {
      navigator.clipboard.writeText(code).then(() => {
        showToast(`已複製 [${name}] Mapcode: ${code}`);
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.remove('opacity-0');
      setTimeout(() => toast.classList.add('opacity-0'), 2500);
    }

    // 預設載入序章
    loadChapter(0);
    updateStampTotal();
  </script>
</body>
